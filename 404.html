<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
        /* ✅  Universal GitHub Pages redirect for Vite / React */
        (function () {
            const repo = "/tony-thompson-spmn-vital"; // your repo name
            const redirect = sessionStorage.redirect || location.pathname;
            delete sessionStorage.redirect;

            // Always send the visitor back to index.html under your repo folder
            location.replace(repo + "/index.html?redirect=" + encodeURIComponent(redirect));
        })();
    </script>
</head>
<body>
    Redirecting…
</body>
</html>
